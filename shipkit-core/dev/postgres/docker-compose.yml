services:
  postgres:
    image: docker.io/postgres:18
    container_name: shipkit_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: shipkit_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d shipkit_dev"]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s

volumes:
  pg_data: