name: Build & Push Docker Images

on:
  pull_request:
    types: [ closed ]
    branches: [ "main" ]

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: vars
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Extract Release Notes
        id: notes
        run: |
          NOTES=$(printf "%s\n" "$PR_BODY" | awk '/^##[[:space:]]+Release Notes/{flag=1;next}/^##/{flag=0}flag')
          NOTES=$(echo "$NOTES" | sed '/^[[:space:]]*$/d')
          if [[ -z "$NOTES" ]]; then
            echo "::error::No Release Notes found in pull request body under '## Release Notes' section" && exit 1
          fi
          # Set multiline output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Determine previous tag
        id: prev_tag
        run: |
          git fetch --tags --quiet
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.event.pull_request.base.sha }} 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate New Contributors section
        id: contributors
        run: |
          set -euo pipefail
          PREV_TAG='${{ steps.prev_tag.outputs.tag }}'

          # Collect authors before previous tag (by email) to determine who is "new"
          if [[ -n "$PREV_TAG" ]]; then
            mapfile -t PREV_AUTHORS < <(git log "$PREV_TAG" --format='%ae|%an' | sort -u)
          else
            PREV_AUTHORS=()
          fi

          # Collect current range authors (since prev tag to this merge commit)
          RANGE="${PREV_TAG:+$PREV_TAG..}${{ github.event.pull_request.merge_commit_sha }}"
          mapfile -t CURR_AUTHORS < <(git log $RANGE --format='%ae|%an' | sort -u || true)

          # Build a set of previous emails for quick lookup
          PREV_EMAILS=$(printf '%s\n' "${PREV_AUTHORS[@]}" | cut -d'|' -f1 | sort -u || true)

          NEW_LIST=()
          for entry in "${CURR_AUTHORS[@]}"; do
            email="${entry%%|*}"
            name="${entry#*|}"
            # Skip bots and CI
            if [[ "$name" =~ \[bot\]$ ]] || [[ "$email" == "actions@github.com" ]] || [[ "$name" == "dependabot" ]] || [[ "$name" == "dependabot[bot]" ]]; then
              continue
            fi
            # First-time contributor if email not seen before previous tag
            if ! printf '%s\n' "$PREV_EMAILS" | grep -Fxq "$email"; then
              NEW_LIST+=("- $name <$email>")
            fi
          done

          if [[ ${#NEW_LIST[@]} -eq 0 ]]; then
            echo "text=None" >> $GITHUB_OUTPUT
          else
            {
              echo "text<<EOF"
              printf '%s\n' "${NEW_LIST[@]}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Set lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build & push k3s-control image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/k3s-control
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/shipkit-k3s-control:latest,ghcr.io/${{ steps.owner.outputs.owner }}/shipkit-k3s-control:${{ steps.vars.outputs.version }}

      - name: Build & push gateway-api image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/gateway-api
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/shipkit-gateway-api:latest,ghcr.io/${{ steps.owner.outputs.owner }}/shipkit-gateway-api:${{ steps.vars.outputs.version }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/shipkit-frontend:latest,ghcr.io/${{ steps.owner.outputs.owner }}/shipkit-frontend:${{ steps.vars.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Compile shipkit-install (linux/amd64)
        run: |
          set -euo pipefail
          cd tools/shipkit-cli
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../shipkit-install ./cmd/installer
          ls -lh ../../shipkit-install

      - name: Upload shipkit-install to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shipkit-install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.vars.outputs.version }}"
          name: "shipkit ${{ steps.vars.outputs.version }}"
          body: |
            ## Release Notes
            ${{ steps.notes.outputs.notes }}

            ## New Contributors
            ${{ steps.contributors.outputs.text }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 