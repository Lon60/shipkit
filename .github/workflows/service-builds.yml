name: Build Services

on:
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-api, k3s-control, frontend, shipkit-cli]
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service == 'gateway-api'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        if: matrix.service == 'k3s-control' || matrix.service == 'shipkit-cli'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Bun
        if: matrix.service == 'frontend'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build gateway-api
        if: matrix.service == 'gateway-api'
        working-directory: apps/gateway-api
        run: ./gradlew build --no-daemon

      - name: Build k3s-control
        if: matrix.service == 'k3s-control'
        working-directory: apps/k3s-control
        run: make build

      - name: Install dependencies and build frontend
        if: matrix.service == 'frontend'
        working-directory: apps/frontend
        env:
          SKIP_ENV_VALIDATION: "1"
        run: |
          bun install
          bun run build

      - name: Build skdev
        if: matrix.service == 'shipkit-cli'
        working-directory: tools/shipkit-cli
        run: go build -trimpath -ldflags "-s -w" -o ../../skdev

      - name: Build shipkit-install
        if: matrix.service == 'shipkit-cli'
        working-directory: tools/shipkit-cli
        run: go build -trimpath -ldflags "-s -w" -o ../../shipkit-install ./cmd/installer