name: Build Services

on:
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-services:
    name: Build All Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-api, k3s-control, frontend]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21 (only for gateway-api)
        if: matrix.service == 'gateway-api'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build gateway-api
        if: matrix.service == 'gateway-api'
        working-directory: apps/gateway-api
        run: ./gradlew build --no-daemon

      # Build k3s-control (Go)
      - name: Set up Go 1.x (only for k3s-control)
        if: matrix.service == 'k3s-control'
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build k3s-control
        if: matrix.service == 'k3s-control'
        working-directory: apps/k3s-control
        run: make build

      # gateway-api and frontend handled above

      - name: Set up Bun (only for frontend)
        if: matrix.service == 'frontend'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps & build frontend
        if: matrix.service == 'frontend'
        working-directory: apps/frontend
        env:
          SKIP_ENV_VALIDATION: "1"
        run: |
          bun install
          bun run build 

      - name: Set up Go for CLI
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build skdev
        run: |
          cd tools/shipkit-cli
          go build -trimpath -ldflags "-s -w" -o ../../skdev ./cmd/skdev

      - name: Build shipkit-install
        run: |
          cd tools/shipkit-cli
          go build -trimpath -ldflags "-s -w" -o ../../shipkit-install ./cmd/installer