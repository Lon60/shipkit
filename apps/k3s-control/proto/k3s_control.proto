syntax = "proto3";

package k3s_control;

option go_package = "github.com/shipkit/k3s-control/proto;k3s_control";

service K3sControlService {
  rpc ApplyDeployment (ApplyRequest) returns (ActionResult);
  rpc DeleteDeployment (DeleteRequest) returns (ActionResult);
  rpc GetStatus (StatusRequest)       returns (AppStatus);
  // Apply arbitrary YAML as-is (no namespace override). Intended for platform-level resources
  // like Traefik IngressRoutes or ConfigMaps. Multiple documents separated by '---' are supported.
  rpc ApplyManifest (ApplyManifestRequest) returns (ActionResult);
  // Delete a specific Kubernetes resource by Group/Version/Kind, namespace, and name.
  rpc DeleteResource (DeleteResourceRequest) returns (ActionResult);
}

message ApplyRequest {
  string uuid = 1;
  string manifest_yaml = 2;
}

message DeleteRequest {
  string uuid = 1;
}

message StatusRequest {
  string uuid = 1;
}

message ActionResult {
  int32 status = 1;   // 0 = OK
  string message = 2;
  string details = 3;
}

message ApplyManifestRequest {
  string manifest_yaml = 1;
}

message DeleteResourceRequest {
  string api_group = 1;   // e.g. "traefik.io" or empty for core
  string api_version = 2; // e.g. "v1alpha1" or "v1"
  string kind = 3;        // e.g. "IngressRoute"
  string namespace = 4;   // empty for cluster-scoped
  string name = 5;        // resource name
}

message AppStatus {
  string uuid = 1;
  AppState state = 2;
  repeated ContainerStatus containers = 3;
  string message = 4;
  int32 status = 5;
}

enum AppState {
  UNKNOWN = 0;
  RUNNING = 1;
  STOPPED = 2;
  STARTING = 3;
  STOPPING = 4;
  ERROR = 5;
}

message ContainerStatus {
  string name = 1;
  string state = 2; // running, crashed, etc.
  string readiness = 3;
  repeated string ports = 4; // 8080/TCP, 7777/UDP
} 