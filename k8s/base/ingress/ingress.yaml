apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shipkit-gateway-api
  namespace: shipkit-system
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      services:
        - name: gateway-api
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shipkit-frontend
  namespace: shipkit-system
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: shipkit-frontend
          port: 3000