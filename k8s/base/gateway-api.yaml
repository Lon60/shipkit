apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      serviceAccountName: gateway-api
      containers:
        - name: gateway-api
          image: ghcr.io/lon60/shipkit-gateway-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shipkit-env
          env:
            - name: K3S_CONTROL_HOST
              value: k3s-control.shipkit-system.svc.cluster.local
            - name: K3S_CONTROL_PORT
              value: "9998"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-api
  namespace: shipkit-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-api-ingress-manager
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-api-ingress-manager-binding
subjects:
  - kind: ServiceAccount
    name: gateway-api
    namespace: shipkit-system
roleRef:
  kind: ClusterRole
  name: gateway-api-ingress-manager
  apiGroup: rbac.authorization.k8s.io 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-config-manager
  namespace: traefik
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"]
  resourceNames: ["traefik-config"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "watch"]
  resourceNames: ["traefik"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-api-can-manage-traefik
  namespace: traefik
subjects:
- kind: ServiceAccount
  name: gateway-api
  namespace: shipkit-system
roleRef:
  kind: Role
  name: traefik-config-manager
  apiGroup: rbac.authorization.k8s.io 