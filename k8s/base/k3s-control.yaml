apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-control-sa
  namespace: shipkit-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-control
  namespace: shipkit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3s-control
  template:
    metadata:
      labels:
        app: k3s-control
    spec:
      serviceAccountName: k3s-control-sa
      containers:
      - name: server
        image: ghcr.io/lon60/shipkit-k3s-control:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9998
          name: grpc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-control-sa-cluster-admin
subjects:
  - kind: ServiceAccount
    name: k3s-control-sa
    namespace: shipkit-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: k3s-control
  namespace: shipkit-system
spec:
  selector:
    app: k3s-control
  ports:
  - port: 9998
    targetPort: 9998
    protocol: TCP
    name: grpc
  type: ClusterIP 