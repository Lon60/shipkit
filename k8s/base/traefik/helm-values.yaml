service:
  enabled: true
  single: true
  type: LoadBalancer
  annotations: {}

persistence:
  enabled: true
  name: traefik-acme
  accessMode: ReadWriteOnce
  size: 128Mi
  path: /data

additionalArguments: []

envFrom:
  - secretRef:
      name: traefik-acme

deployment:
  initContainers:
    - name: volume-permissions
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          touch /data/acme.json
          chmod 600 /data/acme.json
      volumeMounts:
        - name: traefik-acme
          mountPath: /data

certificatesResolvers:
  letsencrypt:
    acme:
      email: ""
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    tls:
      enabled: true
      certResolver: letsencrypt

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
