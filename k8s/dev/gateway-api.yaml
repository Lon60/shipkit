apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: gateway-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres.shipkit-system.svc.cluster.local:5432/shipkit
            - name: DATABASE_USERNAME
              value: postgres
            - name: DATABASE_PASSWORD
              value: postgres

            - name: JWT_SECRET
              value: change_me
            - name: JWT_EXPIRATION_MS
              value: "3600000"
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:3000

            - name: K3S_CONTROL_HOST
              value: k3s-control.shipkit-system.svc.cluster.local
            - name: K3S_CONTROL_PORT
              value: "9998"
          ports:
            - containerPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: shipkit-system
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: strip-api
      services:
        - name: gateway-api
          port: 8080 