apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: gateway-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.shipkit-system.svc.cluster.local:5432/shipkit
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: K3S_CONTROL_HOST
              value: k3s-control.shipkit-system.svc.cluster.local:9998
          ports:
            - containerPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-api
  namespace: shipkit-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`) && PathPrefix(`/graphql`)
      kind: Rule
      services:
        - name: gateway-api
          port: 8080 