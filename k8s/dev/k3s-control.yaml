apiVersion: v1
kind: Namespace
metadata:
  name: shipkit-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-control
  namespace: shipkit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3s-control
  template:
    metadata:
      labels:
        app: k3s-control
    spec:
      containers:
      - name: server
        image: k3s-control:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 9998
          name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: k3s-control
  namespace: shipkit-system
spec:
  selector:
    app: k3s-control
  ports:
  - port: 9998
    targetPort: 9998
    protocol: TCP
    name: grpc
  type: ClusterIP 